	<script>
		document.getElementById("openfl-content").style.display = "none";

		function onApplicationLoaded() {
			document.getElementById("openfl-loading").remove();
			document.getElementById("openfl-content").style.display = "block";
		}

		function handledApplicationError() {
			document.getElementById("openfl-error-content").style.display = "flex";
			let content = document.getElementById("openfl-content");
			if (content != null) { content.remove(); }
		}
	</script>
	
	<script>
		window.WF_MOD_BUILD = "0.3.3";
		window.WF_DEMO_BOOT_MODE = new URLSearchParams(window.location.search).get("wfmode") || "tutorial";
		// Development aids, off unless asked for: ?wfdev=fastskill or fastskill:2000
		window.WF_DEV = new URLSearchParams(window.location.search).get("wfdev") || "";

		// The bundle is obfuscator-hardened and replaces console.log/info/warn/error
		// with no-ops as soon as it runs, so anything WFMod logs after that point
		// silently disappears. Keep our own handles, taken before the bundle loads.
		window.__wfConsole = {
			log: console.log.bind(console),
			info: console.info.bind(console),
			warn: console.warn.bind(console),
			error: console.error.bind(console)
		};
		console.info("[WFMod] build=" + window.WF_MOD_BUILD + " mode=" + window.WF_DEMO_BOOT_MODE + " bundle=pristine+patches data=pristine");

		// OpenFL/Lime loads most runtime assets via XMLHttpRequest. Node's `http-server`
		// caches static paths by default, which can mix a new JS bundle with an older
		// .orderedmap. Give every same-origin runtime XHR a build-specific URL and ask
		// the browser not to reuse its cache.
		(function () {
			var originalOpen = XMLHttpRequest.prototype.open;
			XMLHttpRequest.prototype.open = function (method, url) {
				try {
					var u = new URL(String(url), window.location.href);
					if (u.origin === window.location.origin) {
						u.searchParams.set("wfbuild", window.WF_MOD_BUILD);
						url = u.href;
					}
				} catch (e) {}
				var args = Array.prototype.slice.call(arguments);
				args[1] = url;
				return originalOpen.apply(this, args);
			};
			var originalSend = XMLHttpRequest.prototype.send;
			XMLHttpRequest.prototype.send = function () {
				try { this.setRequestHeader("Cache-Control", "no-cache"); } catch (e) {}
				return originalSend.apply(this, arguments);
			};
		})();
	</script>

	<script type="text/javascript">
		(function () {
			// Hooks are installed when the bundle's class registry appears, rather
			// than from the script's load event.
			//
			// Waiting on load meant waiting on a code path whose behaviour we never
			// established - and the symptom was invisible anyway, because the bundle
			// silences the console (see __wfConsole above), so working hooks looked
			// like no hooks. Polling for WF_INTERNALS does not care who starts the
			// game or when. wfmod/runtime.js polls too; applyHooks() is idempotent.
			var hooksInstalled = false;
			function installHooksWhenReady() {
				if (hooksInstalled) return;
				if (!window.WFMod || !window.WFMod.runtime) {
					window.__wfConsole.error("[WFMod] wfmod/runtime.js did not load; runtime hooks skipped");
					hooksInstalled = true;
					return;
				}
				var deadline = Date.now() + 60000;
				var timer = setInterval(function () {
					if (window.WF_INTERNALS) {
						clearInterval(timer);
						hooksInstalled = true;
						window.WFMod.runtime.applyHooks();
					} else if (Date.now() > deadline) {
						clearInterval(timer);
						window.__wfConsole.error("[WFMod] window.WF_INTERNALS never appeared; runtime hooks skipped");
					}
				}, 50);
			}

			function startWorldFlipper() {
				onApplicationLoaded();
				lime.embed("world-flipper", "openfl-content", 540, 960, {
					parameters: {},
					onApplicationError: function () { handledApplicationError(); }
				});

				window.addEventListener("touchmove", function (event) { event.preventDefault(); }, { capture: false, passive: false });
				if (typeof window.devicePixelRatio !== "undefined" && window.devicePixelRatio > 2) {
					var meta = document.getElementById("viewport");
					meta.setAttribute("content", "width=device-width, initial-scale=" + (2 / window.devicePixelRatio) + ", user-scalable=no");
				}
			}

			function appendGameScript(src, revokeUrl) {
				var script = document.createElement("script");
				script.type = "text/javascript";
				script.src = src;
				script.onload = function () {
					if (revokeUrl) URL.revokeObjectURL(src);
					startWorldFlipper();
				};
				script.onerror = function (e) {
					window.__wfConsole.error("[WFMod] failed to load world-flipper.js", e);
					handledApplicationError();
				};
				document.body.appendChild(script);
			}

			// WFTest/world-flipper.js is the pristine official bundle
			// (sha256 db5f3806599510ed3b6783ce5c4ccdac764eccbf4d297299af12eb902a814315).
			// Every modification lives here, as a declarative patch applied to a copy in
			// memory. Run `python3 tools/verify_tree.py` to check the tree against the
			// original archive.
			//
			// The bundle hides every property name behind \xNN escapes, so anchors are
			// built with esc() rather than written literally.
			function esc(text) {
				var out = "";
				for (var i = 0; i < text.length; i++) {
					var hex = text.charCodeAt(i).toString(16);
					out += "\\x" + (hex.length < 2 ? "0" : "") + hex;
				}
				return out;
			}

				"var _wfPlayer=new _0x30d305(this['globalLogic']['getLogicAssets']())['getPlayerSaveData'](0x4);" +
				"_wfPlayer['userInfo']['current_party']=0x1;" +

				"'rightAfterSignUp':_wfLoaded['rightAfterSignUp'],'abortedMultiQuestIsAttention':_wfLoaded['abortedMultiQuestIsAttention']," +

				"'scoreAttackEventRewards':_wfLoaded['scoreAttackEventRewards'],'userOption':_wfLoaded['userOption']," +
				"'shouldPromptTakeoverRegistration':_wfLoaded['shouldPromptTakeoverRegistration']," +

				"this['logic']['applyLoadedData'](_wfData);this['remote']['applyLoadedData'](_wfData);" +

			var UNLOCK_HEAD = "'" + esc("isGameSystemUnlocked") + "':function(_0x17327c,_0x57b468,_0x16c3e8){if(this['" +
				esc("devConfig") + "']['" + esc("allGameSystemAlwaysUnlocked") + "']){return!![];}";

			var TIPS_HEAD = "'" + esc("getTipsTableStats") + "':function(){var _0x4deab4=this['" + esc("globalLogic") + "']['" +
				esc("getLogicAssets") + "']();var _0x233d56=this['" + esc("isDuringTutorial") + "']?_0x4deab4['" +
				esc("getMasterTable") + "'](_0x114e05)['" + esc("get_data") + "']():_0x4deab4['" + esc("getMasterTable") +
				"'](_0xcb719e)['" + esc("get_data") + "']();";

				esc("sendCrashReport") + "']=!![];";

			var CLIENT_ERROR_CTOR = "var _0x34e26d=function(_0x44c93d,_0x94baad){this['" + esc("internalMessage") +
				"']=_0x94baad;this['" + esc("code") + "']=_0x44c93d;};";

			// ("pinball.scene.battle.BattleScene"), but they are locals inside the
			// bundle's IIFE and never reach window. Publishing them is one insertion
			// at the point they are declared.
			var REGISTRY_DECL = "_0x7f6db2=_0x7f6db2||{},_0x38be24;";

			// Each `find` must occur exactly once, or the bootstrap refuses to run.

				{
					id: "auto-button-mode",
					modes: ["tutorial", "challenge"],
					note: "BattleViewInputSettings.get_autoplayButtonMode() fell through to 2 (Hidden). " +
						"Return 1 (OFF) so the button is present and toggleable.",
					find: "else{return 0x2;}},'" + esc("get_autoskillButtonMode") + "':function()",
					replace: "else{return 0x1;}},'" + esc("get_autoskillButtonMode") + "':function()"
				},
				{

					modes: ["tutorial", "challenge"],
					note: "Publish Haxe's class and enum registries as window.WF_INTERNALS. They hold every " +
						"class under its real name, so wfmod/runtime.js can look a class up and hook its " +
						"prototype instead of adding another string replacement. Read-only exposure; the " +
						"registries are the bundle's own objects, not copies.",
					find: REGISTRY_DECL,
					replace: REGISTRY_DECL + "window.WF_INTERNALS={classes:_0x2cc772,enums:_0x7f6db2};"

					modes: ["challenge"],

					replace: GOTO_TUTORIAL_HEAD + CHALLENGE_BOOT

					modes: ["challenge"],
					note: "GlobalAssetPathCollectionBuilder's second argument selects the startup dataset: true " +
						"means bundled+iosbundled only (the tutorial slice), false means full+bundled+iosbundled. " +
						"Challenge mode starts from post-tutorial save data, so it needs the full Trial dataset " +
						"from the very first Global build - player 4, the 18 challenge characters, chapter 111. " +
						"Always take the full path, which is what the game itself does once the tutorial ends. " +
						"The three slices are disjoint in the official data, so this cannot duplicate a key.",
					find: MASTER_BUILDER,
					replace: "var _0x550674=_0x4738f7['createFromMasterAssetPath'](_0x1b0e4b)"

					modes: ["challenge"],
					note: "GameSystemUnlockRepository.isGameSystemUnlocked() throws ClientError 8601 for any key, " +

						"was shipped, so answer 'locked' - what the tutorial path returns - instead of throwing. " +
						"Ask keys() whether the row exists rather than provoking the throw and catching it: the " +
						"caught version still constructed a ClientError, so every menu printed an 8601 with a " +
						"full stack for a condition we handle on purpose.",
					find: UNLOCK_HEAD,
					replace: UNLOCK_HEAD +

						"if(_wfUnlocks['keys']().indexOf(_0x57b468)<0){" +
						"if(!window.__wfLockedSystems){window.__wfLockedSystems={};}" +
						"if(!window.__wfLockedSystems[_0x57b468]){window.__wfLockedSystems[_0x57b468]=true;" +
						"console.warn('[WFMod] game system treated as locked, no row in master game_system_unlock: key='+_0x57b468);}" +
						"return false;}}catch(_wfMissing){return false;}"
				},
				{
					id: "tips-fallback",
					modes: ["challenge"],
					note: "LoadingTipsLogic.getTipsTableStats() reads master tips outside tutorial state and throws " +
						"ClientError 7011 when nothing matches. Master tips has 0 records here; the only 4 TIPS " +
						"live in tutorial_tips_iosbundled with require_single_quest=(None). Fall back to that table.",
					find: TIPS_HEAD,
					replace: TIPS_HEAD +
						"try{if(_0x233d56['keys']().length===0){var _wfTutorialTips=_0x4deab4['getMasterTable'](_0x114e05)['get_data']();" +
						"if(_wfTutorialTips['keys']().length>0){_0x233d56=_wfTutorialTips;" +
						"if(!window.__wfTipsFallbackLogged){window.__wfTipsFallbackLogged=true;" +
						"console.warn('[WFMod] master tips is empty, falling back to tutorial_tips for the loading screen');}}}}" +
						"catch(_wfTipsIgnored){}"
				},
				{
					id: "report-off",
					modes: ["challenge"],
					note: "Every scene change POSTed a logic snapshot to api.worldflipper.jp, which no local build " +
						"can reach. These are the game's own switches - Top.hx disables exactly these three " +
						"together when it runs against a dummy remote.",
					find: REPORT_DEFAULTS,
					replace: "this['normalReport']=false;this['saveCrashReport']=false;this['sendCrashReport']=false;"
				},
				{
					id: "clienterror-reporter",
					modes: ["tutorial", "challenge"],
					note: "Log one line per distinct ClientError. Without it the first real failure is buried " +
						"under the SipoError/event cascade it triggers. Console output only.",
					find: CLIENT_ERROR_CTOR,
					replace: "var _0x34e26d=function(_0x44c93d,_0x94baad){this['internalMessage']=_0x94baad;this['code']=_0x44c93d;" +

			window.WF_PATCHES = PATCHES;

			function applyPatches(source, mode) {
				var applied = [];
				for (var i = 0; i < PATCHES.length; i++) {
					var patch = PATCHES[i];
					if (patch.modes.indexOf(mode) < 0) continue;
					var at = source.indexOf(patch.find);
					if (at < 0) {
						throw new Error("WFMod patch '" + patch.id + "': anchor not found; refusing to run an unverified bundle");
					}
					if (source.indexOf(patch.find, at + 1) >= 0) {
						throw new Error("WFMod patch '" + patch.id + "': anchor is not unique; refusing to run an unverified bundle");
					}
					source = source.slice(0, at) + patch.replace + source.slice(at + patch.find.length);
					applied.push(patch.id);
				}
				return { source: source, applied: applied };
			}

			window.WF_APPLY_PATCHES = applyPatches;

			var gameUrl = "world-flipper.js?wfbuild=" + encodeURIComponent(window.WF_MOD_BUILD);
			var mode = window.WF_DEMO_BOOT_MODE;

			fetch(gameUrl, { cache: "no-store" }).then(function (response) {
				if (!response.ok) throw new Error("HTTP " + response.status + " while loading " + gameUrl);
				return response.text();
			}).then(function (source) {
				var result = applyPatches(source, mode);
				console.info("[WFMod] " + result.applied.length + " patches applied (" + mode + "): " + result.applied.join(", "));
				var blobUrl = URL.createObjectURL(new Blob([result.source], { type: "text/javascript" }));

				installHooksWhenReady();
			}).catch(function (error) {
				console.error("[WFMod] bootstrap patching failed", error);
				handledApplicationError();
			});
		})();
