<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<title>WORLD FLIPPER</title>
	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="apple-mobile-web-app-capable" content="yes">

	
	<link rel="shortcut icon" type="image/png" href="favicon.png">

	<style>
		html,body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
		#openfl-content { background: #000000; width: 100%; height: 100%; }
		#openfl-error-content { display: none; justify-content: center; align-items: center; width: 100%; height: 100%; }
		#openfl-loading { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }
		@font-face {
			font-family: 'WF_r';
			src: url('assets/fonts/WF_r.eot?#iefix') format('embedded-opentype'),
			url('assets/fonts/WF_r.woff') format('woff'),
			url('assets/fonts/WF_r.ttf') format('truetype'),
			url('assets/fonts/WF_r.svg#WF_r') format('svg');
			font-weight: normal;
			font-style: normal;
		}

	</style>
</head>
<body>
	<noscript>This webpage makes extensive use of JavaScript. Please enable JavaScript in your web browser to view this page.</noscript>

	<div id="openfl-loading"><img src="loading.gif"></div>
	<div id="openfl-error-content"><img src="error_splash.png"></div>
	<div id="openfl-content"></div>

	<script>
		document.getElementById("openfl-content").style.display = "none";

		function onApplicationLoaded() {
			document.getElementById("openfl-loading").remove();
			document.getElementById("openfl-content").style.display = "block";
		}

		function handledApplicationError() {
			document.getElementById("openfl-error-content").style.display = "flex";
			let content = document.getElementById("openfl-content");
			if (content != null) { content.remove(); }
		}
	</script>
	
	<script>
		window.WF_MOD_BUILD = "0.2.4";
		window.WF_DEMO_BOOT_MODE = new URLSearchParams(window.location.search).get("wfmode") || "tutorial";
		console.info("[WFMod] build=" + window.WF_MOD_BUILD + " mode=" + window.WF_DEMO_BOOT_MODE + " master=merged-trial global=full-only-bridge");

		// OpenFL/Lime loads most runtime assets via XMLHttpRequest. Node's `http-server`
		// caches static paths by default, which can mix a new JS bundle with an older
		// .orderedmap. Give every same-origin runtime XHR a build-specific URL and ask
		// the browser not to reuse its cache.
		(function () {
			var originalOpen = XMLHttpRequest.prototype.open;
			XMLHttpRequest.prototype.open = function (method, url) {
				try {
					var u = new URL(String(url), window.location.href);
					if (u.origin === window.location.origin) {
						u.searchParams.set("wfbuild", window.WF_MOD_BUILD);
						url = u.href;
					}
				} catch (e) {}
				var args = Array.prototype.slice.call(arguments);
				args[1] = url;
				return originalOpen.apply(this, args);
			};
			var originalSend = XMLHttpRequest.prototype.send;
			XMLHttpRequest.prototype.send = function () {
				try { this.setRequestHeader("Cache-Control", "no-cache"); } catch (e) {}
				return originalSend.apply(this, arguments);
			};
		})();
	</script>
	<script type="text/javascript" src="lib/pako.min.js?wfbuild=0.2.4"></script>
	<script type="text/javascript">
		(function () {
			function startWorldFlipper() {
				onApplicationLoaded();
				lime.embed("world-flipper", "openfl-content", 540, 960, {
					parameters: {},
					onApplicationError: function () { handledApplicationError(); }
				});

				window.addEventListener("touchmove", function (event) { event.preventDefault(); }, { capture: false, passive: false });
				if (typeof window.devicePixelRatio !== "undefined" && window.devicePixelRatio > 2) {
					var meta = document.getElementById("viewport");
					meta.setAttribute("content", "width=device-width, initial-scale=" + (2 / window.devicePixelRatio) + ", user-scalable=no");
				}
			}

			function appendGameScript(src, revokeUrl) {
				var script = document.createElement("script");
				script.type = "text/javascript";
				script.src = src;
				script.onload = function () {
					if (revokeUrl) URL.revokeObjectURL(src);
					startWorldFlipper();
				};
				script.onerror = function (e) {
					console.error("[WFMod] failed to load world-flipper.js", e);
					handledApplicationError();
				};
				document.body.appendChild(script);
			}

			var gameUrl = "world-flipper.js?wfbuild=" + encodeURIComponent(window.WF_MOD_BUILD);
			if (window.WF_DEMO_BOOT_MODE !== "challenge") {
				appendGameScript(gameUrl, false);
				return;
			}

			// Challenge boot happens before the official post-tutorial Global(false)
			// master load. v0.2.3 already merged full data into every iosbundled
			// table that has an iosbundled counterpart. What is still missing are
			// full-only master tables such as quest/main_chapter. Patch the
			// Global(true) builder in memory so those full-only tables are loaded
			// during the initial bootstrap, without loading duplicate full tables
			// for merged iosbundled groups.
			fetch(gameUrl, { cache: "no-store" }).then(function (response) {
				if (!response.ok) throw new Error("HTTP " + response.status + " while loading " + gameUrl);
				return response.text();
			}).then(function (source) {
				var builderMarker = "var _0x550674=_0x3d4eef?new _0x4738f7";
				var builderPos = source.indexOf(builderMarker);
				var nextPos = builderPos < 0 ? -1 : source.indexOf(";var _0x4b4098=", builderPos);
				if (builderPos < 0 || nextPos < 0 || source.indexOf(builderMarker, builderPos + 1) >= 0) {
					throw new Error("WFMod v0.2.4 patch anchor mismatch; refusing to run an unverified bundle");
				}

				var bridge = "if(typeof window!==\"undefined\"&&window.WF_DEMO_BOOT_MODE===\"challenge\"&&_0x3d4eef){var _wfIos=_0x316d35['iosBundledPaths'];var _wfHasIos=_0x12a81b[_0x21232a]!=null?_wfIos['existsReserved'](_0x21232a):_wfIos['h']['hasOwnProperty'](_0x21232a);if(!_wfHasIos){_0x550674['filePaths']['unshift'](_0x1b0e4b['path']);}}";
				source = source.slice(0, nextPos + 1) + bridge + source.slice(nextPos + 1);
				console.info("[WFMod] v0.2.4 runtime patch applied: challenge Global(true) now loads full-only master tables");

				var blobUrl = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
				appendGameScript(blobUrl, true);
			}).catch(function (error) {
				console.error("[WFMod] challenge bootstrap patch failed", error);
				handledApplicationError();
			});
		})();
	</script>
</body>
</html>
